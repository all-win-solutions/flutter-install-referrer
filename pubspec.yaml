name: flutter_install_referrer
description: Detect from where your application was installed (Google Play, App Store, TestFlight…)
version: 3.0.1
homepage: https://github.com/all-win-solutions/flutter-install-referrer

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^28.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.allwinsolutions.flutter_install_referrer
        pluginClass: InstallReferrerPlugin
      ios:
        pluginClass: InstallReferrerPlugin
